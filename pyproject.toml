[project]
authors = [{name = "Nils Müller", email = "nils.n.mueller@gmail.com"}]
dependencies = ["sdfr>=1.4.13,<2"]
name = "analysis"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
analysis = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]
ipykernel = ">=7.1.0,<8"
matplotlib = ">=3.10.8,<4"
jupyterlab = ">=4.5.0,<5"
h5py = ">=3.15.1,<4"
scipy = ">=1.16.3,<2"
colormaps = ">=0.4.2,<0.5"
ipywidgets = ">=8.1.8,<9"
tqdm = ">=4.67.1,<5"
